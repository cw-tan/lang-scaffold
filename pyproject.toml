[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lang-scaffold"
version = "0.1.0"
description = "Modular utilities for LangChain/LangGraph workflows."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Chuin Wei Tan", email = "chuinwei.tan@gmail.com"},
]
dependencies = [
    "langchain",
    "langgraph",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
]

[tool.setuptools]
packages = {find = {include = ["lang_scaffold", "lang_scaffold.*"]}}

[tool.ruff]
line-length = 88
exclude = [
    ".eggs",
    "*.egg",
    "build",
    "dist",
    "docs",
    ".git",
    "__pycache__",
    "examples",
    "tmp"
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["E226", "E501", "E741", "E743", "C901", "E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
